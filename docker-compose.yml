services:
  # Development environment
  dev:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    container_name: gates-gis-chat-app-dev
    ports:
      - "8284:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    
  # Staging environment
  staging:
    build:
      context: .
      dockerfile: docker/staging/Dockerfile
    container_name: gates-gis-chat-app-staging
    ports:
      - "80:80"
    environment:
      - NODE_ENV=staging
