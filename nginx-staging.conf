server {
    listen 80;
    server_name staging.gates.dost.gov.ph;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/gates-gis-access.log;
    error_log /var/log/nginx/gates-gis-error.log;

    location = / {
        default_type text/plain;
        return 200 'Coming soon...';
    }

    location /gis-chat {
        try_files $uri $uri/ /index.html;
    }
}
